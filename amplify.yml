version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify env vars are available as shell environment variables.
        # Explicitly export them so Next.js can inline server-only values
        # into the SSR bundle at build time.
        - export MONGODB_URI
        - export MONGODB_DB
        - export ADMIN_SECRET
        - export CRON_SECRET
        - export RAPIDAPI_KEY
        - export SARVAM_API_KEY
        - export OPENAI_API_KEY
        - export NEXT_PUBLIC_APP_URL
        - export NEXT_PUBLIC_SUPABASE_URL
        - export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        - export SUPABASE_SERVICE_ROLE_KEY
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
