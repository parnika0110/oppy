version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Write Amplify console env vars into .env.production so Next.js
        # can read them at both build time and SSR Lambda runtime.
        # Only variable names appear here — values come from the Amplify console.
        - env | grep -e MONGODB_URI -e MONGODB_DB -e ADMIN_SECRET -e CRON_SECRET -e RAPIDAPI_KEY -e SARVAM_API_KEY -e OPENAI_API_KEY -e NEXT_PUBLIC_APP_URL -e NEXT_PUBLIC_SUPABASE_URL -e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY -e SUPABASE_SERVICE_ROLE_KEY >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
